changelog:
  categories:
    - title: "Breaking Changes"
      labels:
        - "breaking-change"
        - "breaking"
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "Maintenance & Infrastructure"
      labels:
        - "chore"
        - "dependencies"
        - "documentation"
