config:
  validation: true
  warningsAsErrors: false

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    excludes:
      - '**/*Test.kt'
      - '**/testing/**'
      - '**/testFixtures/**'
      - '**/tools/**'
      - '**/sample/**'
      - '**/di/**'
      - '**/*Module.kt'
      - '**/*Component.kt'
  UndocumentedPublicFunction:
    active: true
    excludes:
      - '**/*Test.kt'
      - '**/testing/**'
      - '**/testFixtures/**'
      - '**/tools/**'
      - '**/sample/**'
      - '**/di/**'
      - '**/*Module.kt'
      - '**/*Component.kt'
  UndocumentedPublicProperty:
    active: false

backend-rules:
  active: true
  KtorConsistentRoutePermissions:
    active: true
  KtorDelegatedRouteHandler:
    active: true
  KtorRoutePathConstant:
    active: true
  KtorStrictRouteDefinition:
    active: true
  NoDirectSystemEnv:
    active: true
  NoSuspendInsideDatabaseTransaction:
    active: true
  PreferConstructorInjection:
    active: true
  RequireUtcTime:
    active: true
