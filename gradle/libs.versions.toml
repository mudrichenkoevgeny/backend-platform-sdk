[versions]
# @keep
jvmToolchain = "25"

# Plugins & Core
kotlin = "2.4.21"
ksp = "2.3.12"
gradleup-shadow = "9.3.0"
maven-publish-plugin = "0.37.0"
dependency-analysis = "3.19.2"
gradle-versions-plugin = "0.66.0"

# Shared Foundation
shared-foundation = "0.0.97"

# Kotlin
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
kotlinx-io-core = "0.9.1"
kotlin-reflect = "2.4.21"

# Ktor
ktor = "3.6.0"

# DI
dagger = "2.60.1"
javax-inject = "1"

# Database
exposed = "1.6.0"
postgresql = "42.7.14"
hikari = "7.1.0"
flyway = "13.11.1"

# Swagger
smiley4-ktor = "5.7.0"
smiley4-schema = "2.7.2"

# Logging
logback = "1.5.38"
logstash = "9.0"
slf4j = "2.0.20"

# Auth & Security
jjwt = "0.13.0"
password4j = "1.8.4"
java-jwt = "4.6.2"
google-auth = "1.54.0"
google-http-client = "2.2.0"

# Observability
opentelemetry = "1.67.0"
opentelemetry-semconv = "1.37.0"
micrometer = "1.17.1"

# Infrastructure
lettuce = "7.2.3.RELEASE"
apache-kafka = "4.4.0"
aws-sdk = "2.57.1"

# Testing
junit = "6.1.3"
mockk = "1.14.11"
h2database = "2.5.252"

[libraries]
# Shared Foundation
shared-foundation-core-common = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-core-common", version.ref = "shared-foundation" }
shared-foundation-core-storage = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-core-storage", version.ref = "shared-foundation" }
shared-foundation-core-settings = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-core-settings", version.ref = "shared-foundation" }
shared-foundation-core-security = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-core-security", version.ref = "shared-foundation" }
shared-foundation-core-audit = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-core-audit", version.ref = "shared-foundation" }
shared-foundation-feature-user = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-feature-user", version.ref = "shared-foundation" }
shared-foundation-fixtures = { group = "io.github.mudrichenkoevgeny", name = "shared-foundation-testing", version.ref = "shared-foundation" }

# Kotlin
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" } # Transitive for Shared Foundation, Ktor, kotlinx-serialization
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" } # Transitive for Ktor
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io-core" } # Transitive for Ktor
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin-reflect" } # Transitive for Ktor

# Ktor
ktor-server-core = { group = "io.ktor", name = "ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { group = "io.ktor", name = "ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors", version.ref = "ktor" }
ktor-server-default-headers-jvm = { group = "io.ktor", name = "ktor-server-default-headers-jvm", version.ref = "ktor" }
ktor-server-forwarded-header-jvm = { group = "io.ktor", name = "ktor-server-forwarded-header-jvm", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-rate-limit = { group = "io.ktor", name = "ktor-server-rate-limit", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock-jvm", version.ref = "ktor" }
ktor-server-metrics-micrometer = { group = "io.ktor", name = "ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" } # Transitive for Ktor
ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" } # Transitive for Ktor
ktor-serialization = { group = "io.ktor", name = "ktor-serialization", version.ref = "ktor" } # Transitive for Ktor
ktor-utils = { group = "io.ktor", name = "ktor-utils", version.ref = "ktor" } # Transitive for Ktor
ktor-websockets = { group = "io.ktor", name = "ktor-websockets", version.ref = "ktor" } # Transitive for Ktor
ktor-events = { group = "io.ktor", name = "ktor-events", version.ref = "ktor" } # Transitive for Ktor

# DI
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javax-inject" } # Transitive for dagger

# Database
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-dao = { group = "org.jetbrains.exposed", name = "exposed-dao", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-json = { group = "org.jetbrains.exposed", name = "exposed-json", version.ref = "exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposed" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }

# Swagger
smiley4-ktor-openapi = { group = "io.github.smiley4", name = "ktor-openapi", version.ref = "smiley4-ktor" }
smiley4-ktor-swagger-ui = { group = "io.github.smiley4", name = "ktor-swagger-ui", version.ref = "smiley4-ktor" }
smiley4-schema-kenerator-core = { group = "io.github.smiley4", name = "schema-kenerator-core", version.ref = "smiley4-schema" }
smiley4-schema-kenerator-serialization = { group = "io.github.smiley4", name = "schema-kenerator-serialization", version.ref = "smiley4-schema" }
smiley4-schema-kenerator-swagger = { group = "io.github.smiley4", name = "schema-kenerator-swagger", version.ref = "smiley4-schema" }

# Logging
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
logstash = { group = "net.logstash.logback", name = "logstash-logback-encoder", version.ref = "logstash" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" } # Transitive for Ktor, Swagger

# Auth & Security
jjwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jjwt" }
jjwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version.ref = "jjwt" }
password4j = { group = "com.password4j", name = "password4j", version.ref = "password4j" }
java-jwt = { group = "com.auth0", name = "java-jwt", version.ref = "java-jwt" }
google-auth-oauth2-http = { group = "com.google.auth", name = "google-auth-library-oauth2-http", version.ref = "google-auth" }
google-http-client = { group = "com.google.http-client", name = "google-http-client", version.ref = "google-http-client" } # Transitive for google-auth-oauth2-http

# Observability
opentelemetry-api = { group = "io.opentelemetry", name = "opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-extension-kotlin = { group = "io.opentelemetry", name = "opentelemetry-extension-kotlin", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { group = "io.opentelemetry", name = "opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-context = { group = "io.opentelemetry", name = "opentelemetry-context", version.ref = "opentelemetry" } # Transitive for Opentelemetry
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }
micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }

# Infrastructure
lettuce-core = { group = "io.lettuce", name = "lettuce-core", version.ref = "lettuce" }
apache-kafka = { group = "org.apache.kafka", name = "kafka-clients", version.ref = "apache-kafka" }
aws-s3 = { group = "software.amazon.awssdk", name = "s3", version.ref = "aws-sdk" }
aws-apache-client = { group = "software.amazon.awssdk", name = "apache-client", version.ref = "aws-sdk" }
aws-auth = { group = "software.amazon.awssdk", name = "auth", version.ref = "aws-sdk" } # Transitive for aws
aws-core = { group = "software.amazon.awssdk", name = "aws-core", version.ref = "aws-sdk" } # Transitive for aws
aws-http-client-spi = { group = "software.amazon.awssdk", name = "http-client-spi", version.ref = "aws-sdk" } # Transitive for aws
aws-regions = { group = "software.amazon.awssdk", name = "regions", version.ref = "aws-sdk" } # Transitive for aws
aws-sdk-core = { group = "software.amazon.awssdk", name = "sdk-core", version.ref = "aws-sdk" } # Transitive for aws

# Testing
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
h2database = { group = "com.h2database", name = "h2", version.ref = "h2database" }
ktor-client-apache = { group = "io.ktor", name = "ktor-client-apache ", version.ref = "ktor" } # Transitive for Ktor

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
java-library = { id = "java-library" }
application = { id = "application" }
gradleup-shadow = { id = "com.gradleup.shadow", version.ref = "gradleup-shadow" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
gradle-versions-plugin = { id = "io.github.ben-manes.versions", version.ref = "gradle-versions-plugin" }